<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spotipyt</title>
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand">SPOTIPYT</div>
    <input id="filter" class="filter" type="search"
           placeholder="Filter playlists…" autocomplete="off" aria-label="Filter playlists">
    <nav id="playlists" class="playlists"></nav>
  </aside>

  <main class="main">
    <header class="topbar">
      <form id="search-form" class="searchbar">
        <input id="q" type="search" autocomplete="off"
               placeholder="Search tracks, artists, albums…" aria-label="Search tracks">
      </form>
      <div id="stats" class="stats muted small"></div>
    </header>

    <div id="notice" class="notice" role="status"></div>

    <section id="content" class="content"></section>
    <section id="downloads" class="downloads"></section>
  </main>
</div>

<div id="player" class="player"></div>

<script type="module" src="/static/js/main.js"></script>
</body>
</html>
