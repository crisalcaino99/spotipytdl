<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spotipyt</title>
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="logo">◉</span> Spotipyt</div>

    <a class="nav-item nav-all" href="#/all" id="nav-all">
      <span class="nav-icon">▦</span>
      <span>All tracks</span>
      <em id="nav-all-count"></em>
    </a>

    <div class="side-label">Your Library</div>
    <input id="filter" class="filter" type="search"
           placeholder="Filter playlists" autocomplete="off" aria-label="Filter playlists">

    <nav id="playlists" class="playlists"></nav>
  </aside>

  <main class="main">
    <header class="topbar">
      <form id="search-form" class="searchbar">
        <span class="search-icon">⌕</span>
        <input id="q" type="search" autocomplete="off"
               placeholder="What do you want to listen to?" aria-label="Search tracks">
      </form>

      <div class="segmented" id="segmented" role="group" aria-label="Download filter">
        <button type="button" data-filter="all" class="active">All</button>
        <button type="button" data-filter="downloaded">Downloaded</button>
        <button type="button" data-filter="missing">Missing</button>
      </div>

      <div id="stats" class="stats"></div>
    </header>

    <div id="notice" class="notice" role="status"></div>

    <section id="content" class="content"></section>
    <section id="downloads" class="downloads"></section>
  </main>
</div>

<div id="player" class="player"></div>

<script type="module" src="/static/js/main.js"></script>
</body>
</html>
